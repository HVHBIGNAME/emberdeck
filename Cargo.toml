[package]
name = "emberdeck"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "A native Minecraft control plane. One binary, every world."
license = "MIT"
repository = "https://github.com/HVHBIGNAME/emberdeck"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
cap-std = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
mime_guess = "2"
parking_lot = "0.12"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "stream", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.38", features = ["bundled"] }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
toml_edit = "0.23"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
